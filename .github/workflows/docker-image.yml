name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Rebuild hebdomadaire (lundi 05:00 UTC) pour récupérer les nouvelles versions
  # d'Instaloader, de Python/Alpine et de pip sans intervention manuelle
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: immovably/docker-instaloader

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Les pull requests construisent et testent l'image, mais ne publient jamais rien
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build the Docker image (base image and dependencies always refreshed)
        run: |
          docker build . --file Dockerfile --pull --no-cache \
            --tag "$IMAGE:latest"

      - name: Smoke test and read the installed Instaloader version
        id: version
        run: |
          VERSION=$(docker run --rm --entrypoint instaloader "$IMAGE:latest" --version | head -n1)
          test -n "$VERSION"
          # --load-cookies échoue sans browser_cookie3 : on vérifie qu'il est bien importable
          docker run --rm --entrypoint python "$IMAGE:latest" -c "import browser_cookie3"
          echo "Instaloader version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag with the installed Instaloader version
        run: docker tag "$IMAGE:latest" "$IMAGE:${{ steps.version.outputs.value }}"

      - name: Push the Docker image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"
